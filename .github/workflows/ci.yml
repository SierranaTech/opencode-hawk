# Build, test, release pipeline.
#
# Uses only public actions pinned by commit SHA.
#   build    → compiles binary, uploads artifact, runs unit tests
#   cli-test → downloads artifact, runs CLI-level assertions
#   release  → GoReleaser (tag pushes only, gated on cli-test passing)

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - name: Tidy
        run: go mod tidy
        shell: bash

      - name: Format check
        run: test -z "$(gofmt -l cmd/ internal/)"
        shell: bash

      - name: Vet
        run: go vet ./...
        shell: bash

      - name: Test
        run: go test -count=1 -race -shuffle=on ./...
        shell: bash

      - name: Prek (pre-commit hooks)
        run: |
          PREK_VERSION=0.4.9
          curl -sSL "https://github.com/j178/prek/releases/download/v${PREK_VERSION}/prek-x86_64-unknown-linux-gnu.tar.gz" | sudo tar xzf - -C /usr/local/bin --strip-components=1
          prek run --all-files -c prek.toml
        shell: bash

      - name: Build
        run: go build -o bin/hawk ./cmd/hawk
        shell: bash

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hawk
          path: bin/hawk

  cli-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hawk
          path: bin

      - name: Make executable
        run: chmod +x bin/hawk

      - name: Test --version
        run: |
          out="$(./bin/hawk --version)"
          echo "version: $out"
          [ -n "$out" ] || { echo "FAIL: --version produced empty output"; exit 1; }

      - name: Test not-logged-in returns JSON error
        run: |
          out="$(XDG_CONFIG_HOME=/tmp/ci-hawk ./bin/hawk)"
          echo "output: $out"
          echo "$out" | python3 -m json.tool > /dev/null || { echo "FAIL: output is not valid JSON"; exit 1; }
          echo "$out" | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'error' in d, 'missing error field'; assert d['error'] != '', 'empty error field'" || { echo "FAIL: missing or empty error field"; exit 1; }

      - name: Test --out writes JSON file
        run: |
          outfile=/tmp/ci-hawk-test.json
          XDG_CONFIG_HOME=/tmp/ci-hawk ./bin/hawk --out "$outfile" || true
          [ -f "$outfile" ] || { echo "FAIL: --out did not create file"; exit 1; }
          python3 -m json.tool "$outfile" > /dev/null || { echo "FAIL: output file is not valid JSON"; exit 1; }
          python3 -c "import json; d=json.load(open('$outfile')); assert 'error' in d or 'rolling' in d, 'unexpected output'" || { echo "FAIL: output shape wrong"; exit 1; }

      - name: Test bad subcommand exits non-zero
        run: |
          if ./bin/hawk nosuchcommand 2>/dev/null; then
            echo "FAIL: expected non-zero exit for invalid subcommand"
            exit 1
          fi

      - name: Test logout
        run: |
          XDG_CONFIG_HOME=/tmp/ci-hawk ./bin/hawk logout
          echo "logout exit: $?"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: cli-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
