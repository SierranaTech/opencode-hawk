[tools]
go = "latest"

[tasks.tidy]
description = "Tidy Go module"
run = "go mod tidy"

[tasks.fmt]
description = "Format Go source"
run = "gofmt -w cmd/ internal/"

[tasks.lint]
description = "Vet Go source"
run = "go vet ./..."

[tasks.test]
description = "Run all tests"
run = "go test -count=1 -race ./..."

[tasks.build]
description = "Build for current platform"
run = "go build -o bin/hawk ./cmd/hawk"

[tasks.build-all]
description = "Cross-compile for linux/amd64 and darwin/arm64"
run = """
mkdir -p bin
GOOS=linux GOARCH=amd64 go build -o bin/hawk-linux-amd64 ./cmd/hawk
GOOS=darwin GOARCH=arm64 go build -o bin/hawk-darwin-arm64 ./cmd/hawk
"""

[tasks.ci]
description = "Run full CI pipeline (tidy, fmt check, vet, test, build)"
run = """
go mod tidy
gofmt -d cmd/ internal/
go vet ./...
go test -count=1 -race ./...
go build -o bin/hawk ./cmd/hawk
"""

[tasks.sync-lint-config]
description = "Sync .golangci.yml from SierranaTech/actions (canonical)"
# gh api rather than curl: actions repo is private, so the fetch needs
# the caller's gh auth (locally) or a GITHUB_TOKEN with contents:read on
# that repo (CI). See SierranaTech/actions/golangci-lint/README.md.
# Write to a temp file first: on failure, .golangci.yml is preserved
# (a naive redirect would clobber it with the 4xx error body).
run = '''
set -euo pipefail
tmp=$(mktemp)
trap 'rm -f "$tmp"' EXIT
gh api -H 'Accept: application/vnd.github.raw' \
  'repos/SierranaTech/actions/contents/golangci-lint/common.yml' > "$tmp"
mv "$tmp" .golangci.yml
'''
